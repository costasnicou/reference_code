{% extends 'base.html' %}
{% block main %}

    <form action="{% url 'app:edit_item' item.id %}" class="add-item-form" method="POST">
        <h1>Edit Item</h1>
        {% csrf_token %}
        
        <div class="form-group">
            {{form.item_name.label}} <br>
            {{form.item_name}}
        </div>

        <div class="form-group">
            {{form.item_description.label}}<br>
            {{form.item_description}}
        </div>

        <div class="form-group">
            {{form.item_price.label}}<br>
            {{form.item_price}}
        </div>

        <div class="form-group">
            {{form.item_img.label}}<br>
            {{form.item_img}}
        </div>
        <input class="submit" type="submit" value="Save Item">
    </form>
{% endblock %}
