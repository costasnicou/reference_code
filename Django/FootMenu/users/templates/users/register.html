{% extends 'users/base.html' %}
{% load static %}
{% block main %}
    
    <form action="{% url 'users:register' %}" class="register-form" method="POST">
        {% csrf_token %}
        <img src="{% static 'imgs/logo.png' %}" alt="">
        <h1>Sign Up</h1>
        
        
        <div class="form-group">
            {{form.username.label}} <br>
            {{form.username}}
        </div>

        <div class="form-group">
            {{form.password1.label}}<br>
            {{form.password1}}
        </div>


        <div class="form-group">
            {{form.password2.label}}<br>
            {{form.password2}}
        </div>
        <input type="submit" value="Sign Up">
        <p>Already have an account? Login <a href="{% url 'users:login' %}">here</a></p>
    </form>
  
{% endblock %}
