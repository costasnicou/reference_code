{% extends 'users/base.html' %}
{% load static %}
{% block main %}
    
    <form action="{% url 'users:login' %}" class="register-form" method="POST">
        {% csrf_token %}
        <img src="{% static 'imgs/logo.png' %}" alt="">
        <h1>Login</h1>
        {% csrf_token %}
        
        <div class="form-group">
            {{form.username.label}} <br>
            {{form.username}}
        </div>

        <div class="form-group">
            {{form.password.label}}<br>
            {{form.password}}
        </div>


        <input type="submit" value="Login">
        <p>Don't have an account? Register <a href="{% url 'users:register' %}">here</a></p>
    </form>
  
{% endblock %}
